name: Verify community builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:smoke
      - name: Verify real local speech recognition (isolated public audio fixture)
        run: npm run test:main -- src/main/__tests__/local-recognition.integration.test.ts
        timeout-minutes: 25
        env:
          MURMUR_RUN_MODEL_INTEGRATION: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-evidence-${{ matrix.os }}
          path: test-results/
          retention-days: 7
      - name: Package unsigned Windows installer
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never
      - name: Package unsigned macOS ZIPs
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: community-development-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.exe
          retention-days: 7
